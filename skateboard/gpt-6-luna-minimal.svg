<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 640 460"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Skateboarder ollies onto and grinds a pipe</title>
  <desc id="desc">
    A skateboarder rolls toward a raised metal pipe, ollies onto it,
    grinds across, then ollies off and lands.
  </desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e5f5"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <linearGradient id="pipeMetal" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".35" stop-color="#8ea6b0"/>
      <stop offset=".7" stop-color="#596e79"/>
      <stop offset="1" stop-color="#d0dce0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="460" fill="url(#sky)"/>
  <circle cx="535" cy="78" r="31" fill="#fff5cf" opacity=".85"/>
  <path d="M0 363 Q110 340 220 363 T440 358 T640 360 V460 H0Z"
        fill="#d8e9df"/>
  <path d="M0 420 H640" stroke="#71877f" stroke-width="3"/>
  <path d="M0 424 H640" stroke="#c4d4ca" stroke-width="2"/>

  <!-- Ground shadow -->
  <ellipse cx="314" cy="416" rx="255" ry="8" fill="#536b65" opacity=".14"/>

  <!-- Raised round pipe and supports -->
  <g aria-label="Raised metal pipe">
    <path d="M250 321 L232 420 M400 321 L418 420"
          fill="none" stroke="#596c73" stroke-width="9"/>
    <path d="M250 321 L232 420 M400 321 L418 420"
          fill="none" stroke="#aab9bd" stroke-width="3"/>
    <path d="M220 322 H440" fill="none" stroke="#40545d"
          stroke-width="19" stroke-linecap="round"/>
    <path d="M220 318 H440" fill="none" stroke="url(#pipeMetal)"
          stroke-width="14" stroke-linecap="round"/>
    <path d="M226 315 H434" fill="none" stroke="#ffffff"
          stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    <path d="M223 421 H241 M409 421 H427"
          stroke="#4f6267" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Skater and board move together.
       The two jump sections are eased to approximate smooth takeoff and landing. -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      dur="4.8s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.19;0.34;0.44;0.70;0.80;0.94;1"
      keySplines="
        .33 0 .67 1;
        .33 0 .67 1;
        .33 0 .67 1;
        .33 0 .67 1;
        .33 0 .67 1;
        .33 0 .67 1;
        .33 0 .67 1"
      values="
        50 400;
        150 400;
        220 310;
        270 310;
        410 310;
        455 328;
        520 400;
        570 400"/>

    <!-- Body: crouched, balanced riding posture -->
    <g stroke="#203946" stroke-width="8" stroke-linecap="round"
       stroke-linejoin="round" fill="none">
      <!-- Legs -->
      <path d="M-2 -57 L-18 -35 L-17 -8"/>
      <path d="M5 -56 L18 -34 L17 -8"/>
      <!-- Torso -->
      <path d="M-2 -94 L-2 -59"/>
      <!-- Arms, held out for balance -->
      <path d="M-3 -89 L-24 -76 L-41 -82"/>
      <path d="M-1 -88 L19 -73 L38 -78"/>
    </g>

    <!-- Shoes -->
    <path d="M-27 -8 Q-17 -14 -8 -8 L-6 -3 H-29Z" fill="#f4f0df"/>
    <path d="M7 -8 Q17 -14 27 -8 L30 -3 H8Z" fill="#f4f0df"/>

    <!-- Shirt -->
    <path d="M-13 -99 Q-3 -105 9 -98 L14 -65 Q1 -57 -13 -64Z"
          fill="#e45d43" stroke="#203946" stroke-width="3"/>
    <!-- Hands -->
    <circle cx="-41" cy="-82" r="5" fill="#d79b70"/>
    <circle cx="38" cy="-78" r="5" fill="#d79b70"/>

    <!-- Head and helmet -->
    <circle cx="1" cy="-116" r="11" fill="#d79b70"
            stroke="#203946" stroke-width="3"/>
    <path d="M-11 -116 Q-8 -131 5 -130 Q15 -128 15 -116Z"
          fill="#f2c84b" stroke="#203946" stroke-width="3"/>
    <path d="M-10 -115 H13" stroke="#203946" stroke-width="2"/>

    <!-- Skateboard: tiny pitch changes on takeoff and dismount -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        dur="4.8s"
        repeatCount="indefinite"
        calcMode="linear"
        keyTimes="0;0.19;0.34;0.44;0.70;0.80;0.94;1"
        values="0;0;-3;0;0;4;0;0"/>
      <!-- Deck -->
      <path d="M-35 -4 Q-33 -8 -27 -8 H27 Q33 -8 35 -4
               Q34 1 28 1 H-28 Q-34 1 -35 -4Z"
            fill="#e7ad43" stroke="#203946" stroke-width="3"/>
      <path d="M-21 -4 H20" stroke="#fff0b7" stroke-width="2" opacity=".8"/>
      <!-- Trucks -->
      <path d="M-22 1 L-22 7 M22 1 L22 7"
            stroke="#536772" stroke-width="3"/>
      <!-- Wheels -->
      <circle cx="-23" cy="9" r="5" fill="#293a43"/>
      <circle cx="23" cy="9" r="5" fill="#293a43"/>
      <circle cx="-23" cy="9" r="2" fill="#9aabb0"/>
      <circle cx="23" cy="9" r="2" fill="#9aabb0"/>
    </g>
  </g>
</svg>